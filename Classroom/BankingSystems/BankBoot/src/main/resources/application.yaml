spring:
  application:
    name: core-banking-system

  datasource:
    url: jdbc:postgresql://localhost:5432/bank_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8090